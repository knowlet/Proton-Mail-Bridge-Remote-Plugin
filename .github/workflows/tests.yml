name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes -r server/requirements.txt
      - name: Run offline unit and contract tests
        run: python -m unittest discover -s server -p 'test_*.py' -v
